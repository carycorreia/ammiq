<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
  <title>Ammo Radar Logo</title>
  <defs>
    <radialGradient id="scopeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d2a20"/>
      <stop offset="100%" stop-color="#061210"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="65%"  stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blipGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="labelHalo" x="-12%" y="-30%" width="124%" height="160%">
      <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="expanded"/>
      <feFlood flood-color="#040e09" flood-opacity="0.95" result="color"/>
      <feComposite in="color" in2="expanded" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="200" rx="10" fill="#0b1a1f"/>

  <!-- ══ RADAR SCOPE — center (100,100) ══ -->
  <g transform="translate(100,100)">
    <circle r="88" fill="url(#scopeBg)" stroke="#1a4a35" stroke-width="1.5"/>
    <circle r="22" fill="none" stroke="#1e5c3a" stroke-width="0.7" opacity="0.7"/>
    <circle r="44" fill="none" stroke="#1e5c3a" stroke-width="0.7" opacity="0.7"/>
    <circle r="66" fill="none" stroke="#1e5c3a" stroke-width="0.7" opacity="0.7"/>
    <circle r="86" fill="none" stroke="#1e5c3a" stroke-width="1"   opacity="0.8"/>
    <line x1="-86" y1="0"   x2="86"  y2="0"   stroke="#1e5c3a" stroke-width="0.6" opacity="0.6"/>
    <line x1="0"   y1="-86" x2="0"   y2="86"  stroke="#1e5c3a" stroke-width="0.6" opacity="0.6"/>
    <line x1="-61" y1="-61" x2="61"  y2="61"  stroke="#1e5c3a" stroke-width="0.4" opacity="0.45"/>
    <line x1="61"  y1="-61" x2="-61" y2="61"  stroke="#1e5c3a" stroke-width="0.4" opacity="0.45"/>

    <!-- Sweep — 6s -->
    <g style="transform-origin:0 0;animation:spin 6s linear infinite">
      <path d="M0,0 L0,-88 A88,88 0 0,1 76.2,-43.9 Z" fill="url(#sweepGrad)" opacity="0.8"/>
      <line x1="0" y1="0" x2="0" y2="-88" stroke="#00ff88" stroke-width="1.4" opacity="0.9"/>
    </g>

    <!-- BLIP 1: upper right ~34.6° → delay 0.58s — label UP -->
    <g transform="translate(38,-55)">
      <circle r="4.5" fill="#00ff88" filter="url(#blipGlow)"
              style="animation:bflash 6s 0.58s linear infinite backwards"/>
      <line x1="0" y1="-5" x2="0" y2="-14" stroke="#00ff88" stroke-width="0.9"
            style="animation:pr 6s 0.58s linear infinite backwards"/>
      <g filter="url(#labelHalo)" style="animation:pr 6s 0.58s linear infinite backwards">
        <text x="0" y="-25" text-anchor="middle" font-family="monospace" font-size="9"    fill="#00ff88">38 SPL BRASS</text>
        <text x="0" y="-13" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#f0a800" font-weight="bold">$0.28 · Grafs</text>
      </g>
    </g>

    <!-- BLIP 2: lower right ~132.5° → delay 2.21s — label DOWN -->
    <g transform="translate(48,44)">
      <circle r="4.5" fill="#00ff88" filter="url(#blipGlow)"
              style="animation:bflash 6s 2.21s linear infinite backwards"/>
      <line x1="0" y1="5" x2="0" y2="14" stroke="#00ff88" stroke-width="0.9"
            style="animation:pr 6s 2.21s linear infinite backwards"/>
      <g filter="url(#labelHalo)" style="animation:pr 6s 2.21s linear infinite backwards">
        <text x="0" y="27" text-anchor="middle" font-family="monospace" font-size="9"    fill="#00ff88">SM PISTOL PRIMER</text>
        <text x="0" y="39" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#f0a800" font-weight="bold">$0.05 · Midso</text>
      </g>
    </g>

    <!-- BLIP 3: lower left ~228.7° → delay 3.81s — label DOWN -->
    <g transform="translate(-50,44)">
      <circle r="4.5" fill="#00ff88" filter="url(#blipGlow)"
              style="animation:bflash 6s 3.81s linear infinite backwards"/>
      <line x1="0" y1="5" x2="0" y2="14" stroke="#00ff88" stroke-width="0.9"
            style="animation:pr 6s 3.81s linear infinite backwards"/>
      <g filter="url(#labelHalo)" style="animation:pr 6s 3.81s linear infinite backwards">
        <text x="0" y="27" text-anchor="middle" font-family="monospace" font-size="9"    fill="#00ff88">IMR 4895 POWDER</text>
        <text x="0" y="39" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#f0a800" font-weight="bold">$34.99/lb · LGun</text>
      </g>
    </g>

    <!-- BLIP 4: upper left ~321.3° → delay 5.36s — label UP -->
    <g transform="translate(-44,-55)">
      <circle r="4.5" fill="#00ff88" filter="url(#blipGlow)"
              style="animation:bflash 6s 5.36s linear infinite backwards"/>
      <line x1="0" y1="-5" x2="0" y2="-14" stroke="#00ff88" stroke-width="0.9"
            style="animation:pr 6s 5.36s linear infinite backwards"/>
      <g filter="url(#labelHalo)" style="animation:pr 6s 5.36s linear infinite backwards">
        <text x="0" y="-25" text-anchor="middle" font-family="monospace" font-size="9"    fill="#00ff88">.308 FMJ 147GR</text>
        <text x="0" y="-13" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#f0a800" font-weight="bold">$0.31/ea · eBay</text>
      </g>
    </g>

    <!-- Center dot -->
    <circle r="3.5" fill="#00ff88" opacity="0.95"/>
    <circle r="1.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- ══ WORDMARK ══ -->
  <text x="208" y="88"
        font-family="Impact,Arial Black,sans-serif"
        font-size="54" fill="#1e6040"
        textLength="196" lengthAdjust="spacingAndGlyphs">AMMO</text>
  <text x="208" y="145"
        font-family="Impact,Arial Black,sans-serif"
        font-size="54" fill="#f0a800"
        textLength="196" lengthAdjust="spacingAndGlyphs">RADAR</text>
  <text x="208" y="164"
        font-family="monospace" font-size="8.5" fill="#3a7a5a"
        textLength="196" lengthAdjust="spacingAndGlyphs">LIVE AMMO PRICE INTELLIGENCE</text>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes pr {
      0%   { opacity: 0; }
      1%   { opacity: 1; }
      7%   { opacity: 0.9; }
      16%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes bflash {
      0%   { opacity: 0.2; }
      1%   { opacity: 1; }
      12%  { opacity: 0.4; }
      18%  { opacity: 0.2; }
      100% { opacity: 0.2; }
    }
  </style>
</svg>
