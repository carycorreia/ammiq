# ─────────────────────────────────────────────────────────────────
# Ammo Radar — Component Tracking Configuration
#
# title_require_any: title must contain at least ONE of these (case-insensitive)
# title_reject:      title must NOT contain ANY of these (case-insensitive)
# price_ceiling:     skip listings > this $/unit (junk filter)
# qty_unit:          "weight" (parse lbs from title) | "count" (parse count from title)
# ─────────────────────────────────────────────────────────────────

metals:
  - id: raw_lead
    name: Raw Lead
    unit: lb
    qty_unit: weight
    price_ceiling: 8.0
    vendors: [rotometals, ebay, midsouth, grafs]
    search_terms:
      - "lead ingots"
      - "soft lead ingots"
      - "lead ingots casting bullet"
      - "pure lead ingots reloading"
      - "raw lead ingots casting sinkers"
    title_require_any:
      - "lead ingot"
      - "lead bar"
      - "pure lead"
      - "soft lead"
      - "range lead"
      - "range recovered lead"
      - "raw lead"
      - "bullet lead"
      - "casting lead"
    title_reject:
      - "alloy"
      - "antimony"
      - "linotype"
      - "lyman"
      - "wheel weight"
      - "solder"
      - "fishing weight kit"
      - "sinker kit"
      - "jig"
      - "bismuth"
      - "tin"

  - id: lyman_2
    name: "Lyman #2 Alloy"
    unit: lb
    qty_unit: weight
    price_ceiling: 12.0
    vendors: [rotometals, ebay, midsouth, grafs]
    search_terms:
      - "Lyman #2 alloy lead casting"
      - "lyman 2 alloy ingots"
    title_require_any:
      - "lyman #2"
      - "lyman 2"
      - "lyman no. 2"
    title_reject:
      - "mold"
      - "mould"
      - "die"
      - "sizer"
      - "lubricator"
      - "book"

  - id: linotype
    name: Linotype
    unit: lb
    qty_unit: weight
    price_ceiling: 15.0
    vendors: [rotometals, ebay, midsouth, grafs]
    search_terms:
      - "linotype lead alloy casting"
      - "linotype metal ingots"
    title_require_any:
      - "linotype"
    title_reject:
      - "% linotype"        # "2% linotype" = it's an alloy WITH linotype, not pure linotype
      - "percent linotype"
      - "linotype mixture"
      - "with linotype"
      - "lead mix"

  # ── Lead Alloys (casting alloys with known antimony/tin %) ──────
  - id: lead_alloy_94_4_2
    name: "Lead Alloy 94/4/2"
    description: "94% Pb, 4% Antimony, 2% Tin — BHN ~13"
    unit: lb
    qty_unit: weight
    price_ceiling: 10.0
    vendors: [rotometals, ebay]
    search_terms:
      - "lead alloy 94 4 2 casting ingots"
      - "bullet casting alloy antimony tin ingots"
      - "hard lead alloy casting ingots"
    title_require_any:
      - "94/4/2"
      - "94-4-2"
      - "hard lead alloy"
      - "bullet casting alloy"
      - "antimony tin lead"
    title_reject:
      - "linotype"
      - "lyman"
      - "solder"

  - id: wheel_weights
    name: "Wheel Weights"
    description: "Scrap wheel weights — mixed alloy, ~BHN 11-12"
    unit: lb
    qty_unit: weight
    price_ceiling: 6.0
    vendors: [ebay]
    search_terms:
      - "wheel weights lead casting bullets"
      - "lead wheel weights bullet casting"
    title_require_any:
      - "wheel weight"
      - "wheel weights"
    title_reject:
      - "tool"
      - "balance"
      - "clip"
      - "stick-on"
      - "adhesive"


