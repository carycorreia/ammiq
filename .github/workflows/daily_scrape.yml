name: AMMO IQ Daily Price Scraper

on:
  schedule:
    # Runs at 6:00 AM Eastern (11:00 UTC) every day
    - cron: "0 11 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.11 — Python 3.13 has a greenlet build incompatibility
          # that breaks firebase-admin installation.
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browser
        working-directory: scraper
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        working-directory: scraper
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_PROJECT_ID:  ${{ secrets.FIREBASE_PROJECT_ID }}
          ALERT_EMAIL_FROM:     ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO:       ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_PASS:     ${{ secrets.ALERT_EMAIL_PASS }}
        run: |
          python scraper.py

      - name: Upload scraper log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_id }}
          path: scraper/scraper.log
          retention-days: 14
